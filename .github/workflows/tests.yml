name: Synthetic prototype checks
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SURVEY_GUROBI_LICENSE: bundled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements.txt -r requirements-demo.txt
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_desktop_bridge.cjs
